name: Verificar PHP
on:
  push:
    branches: [main, 'melhorias/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli
          coverage: none
      - name: Conferir sintaxe PHP
        run: |
          set -e
          for f in ./*.php tests/*.php; do php -l "$f"; done
      - name: Testar validacao e autenticacao
        run: php tests/testar_validacao.php
